services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: mapi-db
    environment:
      - POSTGRES_DB=tide_db
      - POSTGRES_USER=mapi_user
      - POSTGRES_PASSWORD=mapi123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema agora é gerenciado pelo Flyway (src/main/resources/db/migration), aplicado pelo
      # próprio mapi-api ao subir — não pelo init-script do Postgres. Ver V1__baseline_schema.sql.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapi_user -d tide_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mapi-ai:
    build: 
      context: ../projeto-mapi-ai
    container_name: mapi-ai
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tide_db
      - DB_USER=mapi_user
      - DB_PASS=mapi123
      - API_URL=http://mapi-api:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mapi-api:
    build: .
    container_name: mapi-api
    environment:
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/tide_db
      - POSTGRES_USER=mapi_user
      - POSTGRES_PASSWORD=mapi123
      - AI_API_URL=http://mapi-ai:8000
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
      - LOG_PATH=/app/logs
      # Segredo só para o stack local de desenvolvimento (docker compose). Em produção, defina
      # JWT_SECRET no ambiente/secret manager real — nunca reutilize este valor.
      - JWT_SECRET=${JWT_SECRET:-72de304e9224ec7b5f998c91fe76fc4cbfb92adcff845db5ee57fdac0a7de5eb}
      - ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME:-}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-}
      # Cookie Secure exige HTTPS; este stack local não tem TLS em lugar nenhum. Em produção
      # (atrás de TLS de verdade) isso deve ser removido/true.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Front acessa a API via proxy do nginx (mesma origem), então CORS só importa se algo
      # chamar a API direto — mantém restrito ao endereço do front mesmo assim. Os dois hosts
      # (localhost e 127.0.0.1) porque alguns ambientes resolvem "localhost" pra IPv6 (::1)
      # antes de IPv4, e aí o acesso local precisa ser via 127.0.0.1 — Origin muda junto.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Credenciais da ANA (SensorCollectionTask) para a coleta interna de dados hidrometeorológicos
      # reais, que substituiu o antigo processo Python publicando via MQTT. Sem valor padrão de
      # propósito — defina no ambiente/secret manager real; sem elas, o coletor ANA fica desativado
      # (loga aviso e não quebra a aplicação).
      - ANA_IDENTIFICADOR=${ANA_IDENTIFICADOR:-}
      - ANA_SENHA=${ANA_SENHA:-}
    ports:
      - "8080:8080"
    volumes:
      - api_logs:/app/logs
    healthcheck:
      # 9404, não 8080: com management.server.port setado (application.yml), o Actuator migra
      # inteiro pra essa porta — /actuator/health deixa de existir na 8080.
      test: ["CMD", "curl", "-f", "http://localhost:9404/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      mapi-ai:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mapi-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # Só em 127.0.0.1: acessível da própria máquina (ou via túnel SSH em produção), nunca da
      # rede externa — Prometheus não tem autenticação própria.
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mapi-api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    container_name: mapi-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Mesmo padrão do JWT_SECRET acima: valor só para o stack local de desenvolvimento. Em
      # produção, defina GRAFANA_ADMIN_PASSWORD no ambiente/secret manager real.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-mapi123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # 3001, não 3000: a 3000 já é do mapi-front. Mesma restrição a 127.0.0.1 do Prometheus.
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy

  mapi-front:
    build:
      context: ../projeto-mapi-front
      # Vite embute VITE_* no bundle em tempo de BUILD, não de execução — por isso são build
      # args (aplicados só quando a imagem é reconstruída), não `environment` do container.
      # VITE_API_URL não entra mais aqui: a API é acessada via /api/... (proxy do nginx pro
      # mapi-api, mesma origem do front) — ver nginx.conf.
      args:
        VITE_MAP_STYLE_LIGHT: ${VITE_MAP_STYLE_LIGHT:-https://basemaps.cartocdn.com/gl/positron-gl-style/style.json}
        VITE_MAP_STYLE_DARK: ${VITE_MAP_STYLE_DARK:-https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json}
    container_name: mapi-front
    ports:
      - "3000:80"
    healthcheck:
      # 127.0.0.1 explícito, não "localhost": o wget do alpine resolve "localhost" pra ::1
      # (IPv6) primeiro, e o nginx desse image só escuta em IPv4 — com "localhost" o healthcheck
      # falha sempre com "connection refused" mesmo com o nginx up e respondendo normalmente.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mapi-api:
        condition: service_healthy

  status:
    image: alpine:3.20
    container_name: mapi-status
    # Não é um serviço de verdade: só existe pra imprimir esse resumo quando TUDO (inclusive os
    # healthchecks) já estiver de pé — "docker compose up" sozinho não faz isso. Sobe, imprime e
    # sai; "Exited (0)" no "docker compose ps" é o estado esperado dele, não uma falha. Em modo
    # "-d" (destacado) esse resumo não aparece no terminal na hora — veja com
    # "docker compose logs status".
    depends_on:
      postgres:
        condition: service_healthy
      mapi-ai:
        condition: service_started
      mapi-api:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
      mapi-front:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo ""
        echo "================================================================"
        echo " MAPI - stack no ar"
        echo "================================================================"
        echo " Front-end (mapi-front)   http://localhost:3000"
        echo " API (mapi-api)           http://localhost:8080"
        echo " Swagger UI               http://localhost:8080/swagger-ui/index.html"
        echo " AI service (mapi-ai)     http://localhost:8000"
        echo " Postgres (mapi-db)       localhost:5433"
        echo " Prometheus               http://localhost:9090"
        echo " Grafana                  http://localhost:3001  (admin / mapi123 - so dev)"
        echo "================================================================"

volumes:
  postgres_data:
  api_logs:
  prometheus_data:
  grafana_data:
