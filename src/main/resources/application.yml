spring:
  application:
    name: projeto-mapi-api
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tide_db}
    username: ${POSTGRES_USER:mapi_user}
    password: ${POSTGRES_PASSWORD:mapi123}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # O schema já existia (criado organicamente via ddl-auto=update, no passado, antes de existir
    # controle de migration) antes de introduzirmos o Flyway. baseline-on-migrate faz o Flyway, ao
    # encontrar um banco EXISTENTE sem a tabela flyway_schema_history, registrar a V1 (que
    # reproduz esse schema) como "já aplicada" em vez de tentar recriá-la. Num banco NOVO/vazio
    # (ex: CI, ambiente novo), o Flyway ignora o baseline e roda a V1 normalmente.
    baseline-on-migrate: true
    baseline-version: "1"
    baseline-description: "baseline_schema"

jwt:
  # Sem valor padrão de propósito: uma chave "default" versionada no repositório não é segredo
  # nenhum. Se JWT_SECRET não estiver setada, a aplicação deve falhar ao subir, não usar uma
  # chave pública conhecida por qualquer pessoa que tenha acesso a este código-fonte.
  secret: ${JWT_SECRET}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 dias

server:
  tomcat:
    # Desligado por padrão no Spring Boot (custo de registrar MBeans). Sem isso, o Micrometer não
    # consegue publicar tomcat_threads_busy/tomcat_threads_config_max (usadas no painel de
    # Utilization) — só as métricas de sessão, que vêm de outra fonte, aparecem sem isso.
    mbeanregistry:
      enabled: true

app:
  weather:
    api-url: ${WEATHER_API_URL:https://api.open-meteo.com/v1}
  ai:
    api-url: ${AI_API_URL:http://localhost:8000}
  # Timeouts dos clientes HTTP das fontes externas (ver HttpTimeoutProperties/ExternalRestClientFactory).
  # Sem eles, uma fonte que aceita a conexão e não responde prende a thread indefinidamente. A
  # conexão é curta (5s) porque um servidor saudável aceita TCP em milissegundos — se não aceitou
  # em 5s, esperar mais só atrasa o Retry/CircuitBreaker. A leitura padrão (15s) cobre as APIs
  # JSON/HTML pequenas; as fontes abaixo sobrescrevem só o que precisa. Todos os valores podem
  # ser sobrescritos por env (SPRING_APPLICATION_JSON ou APP_HTTP_CLIENTS_<FONTE>_READ_TIMEOUT).
  http:
    default-connect-timeout: 5s
    default-read-timeout: 15s
    clients:
      # A requisição do usuário (/api/mapi) fica bloqueada esperando a predição: melhor devolver
      # "IA indisponível" (tratado pelo chamador) em 8s do que prender a thread e o usuário por 15s+.
      ai:
        connect-timeout: 2s
        read-timeout: 8s
      # APAC/Cemaden (scraping do mesmo host): o endpoint devolve ~8.700 itens por chamada e já
      # foi visto lento; 15s do padrão basta para o ciclo agendado. Cemaden é coletado pelo
      # cliente "apac" (mesmo host, endpoint /cemaden/), por isso não tem entrada própria.
      apac:
        read-timeout: 20s
      # Histórico APAC/ANA baixa tabelas HTML de períodos longos: respostas maiores e mais lentas.
      apac-historical:
        read-timeout: 30s
      # Autenticação da ANA chegou a levar ~30s quando funcionava (ver AnaDataClientImpl.ensureToken);
      # 30s evita contar como falha um login lento porém válido.
      ana:
        read-timeout: 30s
      # ListaEstacoesTelemetricas devolve ~4 MB de XML. Pela rota IPv4 a ANA entregou a ~70 kB/s (~50 s) em
      # 2026-10-21, e o container só tem IPv4; com 30 s a descoberta falhava em todo ciclo. Roda 1 vez a cada 24 h.
      ana-discovery:
        read-timeout: 120s
      # Série de 15 min de um mês inteiro (~1 MB de XML) pelo serviço legado (F2-DADOS-07).
      ana-historical:
        read-timeout: 120s
      # TabuaMare já é limitada por rate limiter (15/min); resposta é JSON pequeno.
      tabua-mare:
        read-timeout: 10s
      # Open-Meteo: previsão/marinho são JSON pequeno (padrão). O arquivo histórico traz um ano de
      # séries horárias (~8.760 pontos x 7 variáveis) numa só resposta.
      open-meteo-archive:
        read-timeout: 60s
      # Painel da CEMADEN: JSON de ~440 estações de uma UF (~100 kB).
      cemaden:
        read-timeout: 20s
      # Nominatim aplica throttling de 1 req/s e é só geocodificação pontual.
      nominatim:
        read-timeout: 10s
      # CKAN do Recife: CSVs completos da Defesa Civil (vários MB) e datastore paginado.
      ckan:
        read-timeout: 60s
  # Coleta interna de dados hidrometeorológicos reais (substitui o antigo fluxo MQTT vindo do
  # projeto Python "projeto-mapi"). A API agora busca esses dados diretamente, em jobs agendados
  # (ver SensorCollectionTask), em vez de depender de um processo externo publicando via broker.
  ana:
    # Sem credenciais versionadas de propósito, igual ao JWT_SECRET — defina via env externamente.
    identifier: ${ANA_IDENTIFICADOR:}
    password: ${ANA_SENHA:}
    auth-url: ${ANA_AUTH_URL:https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/OAUth/v1}
    base-url: ${ANA_BASE_URL:https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/HidroinfoanaSerieTelemetricaAdotada/v1}
    inventory-url: ${ANA_INVENTARIO_URL:https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas/HidroInventarioEstacoes/v1}
    tipo-filtro-data: DATA_LEITURA
    intervalo-busca: HORA_16
    enabled: ${ANA_COLLECTOR_ENABLED:true}
    fixed-rate-ms: ${ANA_COLLECTOR_INTERVAL_MS:900000}
    initial-delay-ms: ${ANA_COLLECTOR_INITIAL_DELAY_MS:15000}
    # Descoberta dinâmica de estações via serviço legado público da ANA (sem autenticação), em vez
    # de uma lista fixa de códigos — validado ao vivo: 2 dos 8 códigos hardcoded originais não
    # existiam mais no inventário ativo. Filtra por UF + raio a partir de um centro (RMR).
    discovery-url: ${ANA_DISCOVERY_URL:http://telemetriaws1.ana.gov.br/ServiceANA.asmx/ListaEstacoesTelemetricas}
    discovery-uf: ${ANA_DISCOVERY_UF:PE}
    discovery-center-lat: ${ANA_DISCOVERY_CENTER_LAT:-8.0476}
    discovery-center-lon: ${ANA_DISCOVERY_CENTER_LON:-34.8770}
    discovery-radius-km: ${ANA_DISCOVERY_RADIUS_KM:50.0}
    discovery-cache-ttl-hours: ${ANA_DISCOVERY_CACHE_TTL_HOURS:24}
  apac:
    base-url: ${APAC_BASE_URL:http://dados.apac.pe.gov.br:41120}
    cemaden-endpoint: ${APAC_CEMADEN_ENDPOINT:cemaden}
    meteorologia-endpoint: ${APAC_METEOROLOGIA_ENDPOINT:meteorologia24h}
    cemaden-rmr-only: ${APAC_CEMADEN_RMR_ONLY:true}
    meteorologia-rmr-only: ${APAC_METEOROLOGIA_RMR_ONLY:false}
    enabled: ${APAC_COLLECTOR_ENABLED:true}
    cemaden-fixed-rate-ms: ${APAC_CEMADEN_INTERVAL_MS:180000}
    meteorologia-fixed-rate-ms: ${APAC_METEOROLOGIA_INTERVAL_MS:300000}
    initial-delay-ms: ${APAC_COLLECTOR_INITIAL_DELAY_MS:20000}
  cemaden:
    # Painel público da CEMADEN (sem credencial): acumulados oficiais de 1 a 96 h por estação, para conferir a soma
    # de blocos do MAPi e servir a chuva de 24 h (GET /api/sensors/cemaden/accumulated).
    base-url: ${CEMADEN_BASE_URL:https://resources.cemaden.gov.br}
    uf: ${CEMADEN_UF:PE}
    cache-ttl-ms: ${CEMADEN_CACHE_TTL_MS:300000}
  tide:
    # Maré prevista (extremos TABUAMARE_PE02) em observation, lida pela timeline de Eventos e pelo cartão do mapa
    # (TideObservationSyncTask). Checa a cobertura a cada 6 h; só chama a TabuaMare quando falta.
    observation-sync-ms: ${TIDE_OBSERVATION_SYNC_MS:21600000}
    observation-sync-initial-delay-ms: ${TIDE_OBSERVATION_SYNC_INITIAL_DELAY_MS:60000}
  cookie:
    # Cookie Secure exige HTTPS — o navegador simplesmente descarta o Set-Cookie se a resposta
    # não veio por HTTPS. Em produção (atrás de TLS de verdade) isso deve ser true; em dev local
    # sem TLS (docker-compose), precisa ser desligado explicitamente via COOKIE_SECURE=false,
    # senão o cookie de sessão nunca é gravado pelo navegador.
    secure: ${COOKIE_SECURE:true}
  cors:
    # Front e API são "same-origin" do ponto de vista do navegador quando acessados através do
    # proxy do nginx (ver nginx.conf do front) — CORS só entra em jogo se algo chamar a API
    # direto, cross-origin. Sem wildcard porque allowCredentials(true) + "*" é proibido pelo
    # próprio spec de CORS (o navegador rejeita).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Nível de log configurado em logback-spring.xml (override via env var APP_LOG_LEVEL).

# Resiliência para as integrações externas (TabuaMare, Open-Meteo, ANA, APAC). Retry só em falhas
# transitórias (rede/5xx) — nunca em 4xx, que é erro do próprio request, repetir não ajuda.
# Circuit breaker evita martelar uma API já fora do ar: depois de muitas falhas seguidas, passa
# a "abrir" e falhar rápido (indo direto pro fallback) por um tempo, em vez de esperar timeout
# a cada requisição.
resilience4j:
  # Defesa em profundidade contra rate-limit: mesmo com a tábua de maré local populada
  # (TideTableSyncService) cobrindo a esmagadora maioria dos lookups, isso limita proativamente
  # as chamadas restantes à API externa em vez de só reagir depois de já ter tomado 429. Validado
  # ao vivo: a TabuaMare devolve "429 Limite por minuto excedido" sob rajada; 15/min é conservador.
  ratelimiter:
    instances:
      tabuaMare:
        limit-for-period: 15
        limit-refresh-period: 60s
        timeout-duration: 5s
  circuitbreaker:
    instances:
      tabuaMare:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      openMeteo:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      anaData:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      apacScrape:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      tabuaMare:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      openMeteo:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      anaData:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      apacScrape:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

management:
  server:
    # Actuator sobe num connector HTTP próprio, separado da porta 8080 da API — assim ele nunca
    # é publicado no docker-compose (só o 8080 é), o que é a real barreira de segurança aqui.
    # O SecurityFilterChain de SecurityConfig continua interceptando essa porta também (testado
    # ao vivo — não há isolamento automático de autenticação só por trocar de porta), por isso
    # /health, /info e /prometheus continuam com regras explícitas de permitAll lá.
    port: ${MANAGEMENT_PORT:9404}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    # /actuator/info mostra commit completo, branch, dirty e data do build (git.properties; RC-03).
    git:
      mode: full
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Habilita os buckets de histograma (série "_bucket") pra http.server.requests, exigidos
      # pelo histogram_quantile() do Prometheus — sem isso só dá pra ver média (sum/count), não
      # percentis (p95/p99), que é justamente o que o dashboard de teoria das filas usa pra
      # responder "como se comportam os casos extremos".
      percentiles-histogram:
        http.server.requests: true
