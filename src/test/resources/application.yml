spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  # As migrations em db/migration são SQL específico de Postgres/TimescaleDB — H2 não entende
  # (CREATE EXTENSION, create_hypertable, etc). Os testes usam ddl-auto=create-drop, que gera o
  # schema H2 direto a partir das entidades JPA, então o Flyway não tem papel nenhum aqui.
  flyway:
    enabled: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  refreshExpiration: 2592000000

app:
  ana:
    enabled: false
    # Os ciclos agendados (SensorCollectionTask) disparam a rodada de previsão em outra thread. Com o intervalo
    # padrão (15 s), ela caía depois da limpeza do banco de um teste e violava fk_flood_predictions_flood_point
    # (log de ERRO). Nos testes o primeiro ciclo só ocorre depois de 1 dia; produção não muda.
    initial-delay-ms: 86400000
  apac:
    enabled: false
    initial-delay-ms: 86400000
  tide:
    # TideObservationSyncTask chamaria a TabuaMare de verdade: nos testes o primeiro ciclo só ocorre depois de 1 dia.
    observation-sync-initial-delay-ms: 86400000

weather:
  apiUrl: https://api.open-meteo.com/v1
